name: Auto-Process New Sessions

# NOTE: the schedule is intentionally DISABLED. Since ~2026-07-17
# livetiming.formula1.com rejects datacenter/GitHub-Actions IPs, so this runner
# cannot fetch laps or telemetry - it only ever wrote drivers.json stubs (driver
# lists come from the unblocked Jolpica API) plus noise commits, which made
# sessions look present on the CDN while carrying no usable data.
# Ingestion now runs locally from a residential IP via ingest.bat /
# scripts/local_ingest.py (Windows scheduled task "F1 Data Ingest").
# workflow_dispatch is kept so this can be re-run by hand if the block is lifted.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  auto-process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update schedule for current year
        run: python scripts/update_schedule.py

      - name: Auto-process new sessions
        run: python scripts/auto_process.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "auto: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && {
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.pushed == 'true'
        run: bash scripts/purge_jsdelivr.sh
