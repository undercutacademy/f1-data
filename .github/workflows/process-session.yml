name: Process F1 Session

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2026)'
        required: true
        default: '2026'
      event:
        description: 'Event name (e.g. Australian Grand Prix)'
        required: true
        default: ''
      session:
        description: 'Session type: R, Q, FP1, FP2, FP3, S, SQ'
        required: true
        default: 'R'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Process session
        run: |
          python scripts/process_session.py \
            "${{ github.event.inputs.year }}" \
            "${{ github.event.inputs.event }}" \
            "${{ github.event.inputs.session }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "data: ${{ github.event.inputs.year }} ${{ github.event.inputs.event }} ${{ github.event.inputs.session }}"
          git push
