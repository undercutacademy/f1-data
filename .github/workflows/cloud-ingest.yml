name: Cloud Ingest (OpenF1)

# Primary ingester since 2026-10: F1's livetiming feed rejects GitHub's IPs, so
# FastF1 can't run here, but OpenF1 can. Its free tier releases each session
# ~30 min after it ends. scripts/local_ingest.py on a home PC stays as a delayed
# fallback.
#
# Triggers: the 15-min cron below is best-effort (GitHub delays or drops it), so
# each run also starts the next one itself, timed for the next session's release
# ("Chain next check"), and update-schedule.yml restarts the chain if it's idle.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Only this session: year (leave all three empty for normal run)'
        required: false
      event:
        description: 'Only this session: event name, e.g. Dutch Grand Prix'
        required: false
      session:
        description: 'Only this session: R, Q, S, SQ, FP1, FP2, FP3'
        required: false
      dry_run:
        description: 'List what would be processed, change nothing'
        type: boolean
        default: false
      force:
        description: 'With a single session: rebuild even if it already has telemetry'
        type: boolean
        default: false
      test_branch:
        description: 'Testing: push to this branch instead of master (no CDN purge)'
        required: false

concurrency:
  group: cloud-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Long enough for the chain step to sleep until the next session's release.
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write   # self-dispatch for the chain
    steps:
      # The data repo is huge: fetch trees but only the blobs of schedule files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /index.json
            /*/events.json
            /*/*/sessions.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q numpy

      - name: Ingest
        env:
          YEAR: ${{ inputs.year }}
          EVENT: ${{ inputs.event }}
          SESSION: ${{ inputs.session }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          PUSH_BRANCH: ${{ inputs.test_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          args=()
          if [ -n "$YEAR" ] && [ -n "$EVENT" ] && [ -n "$SESSION" ]; then
            args+=(--only "$YEAR" "$EVENT" "$SESSION")
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -B scripts/cloud_ingest.py "${args[@]}"

      - name: Chain next check
        # Normal runs only: not single-session, test-branch or dry runs.
        if: always() && inputs.year == '' && inputs.test_branch == '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAIT=$(python -B scripts/cloud_ingest.py --next-check)
          if [ -z "$WAIT" ]; then
            echo "No session due in the next 5.5 h - chain ends (update-schedule.yml restarts it)."
            exit 0
          fi
          echo "Next check in ${WAIT}s"
          sleep "$WAIT"
          gh workflow run cloud-ingest.yml -R "${{ github.repository }}" --ref master
