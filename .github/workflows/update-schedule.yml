name: Update Schedule

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to update (leave empty for all years 2018-current)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write   # watchdog: start cloud-ingest.yml
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update schedule
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            python scripts/update_schedule.py "${{ github.event.inputs.year }}"
          else
            python scripts/update_schedule.py
          fi

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "schedule: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.pushed == 'true'
        run: bash scripts/purge_jsdelivr.sh

      # Watchdog for the cloud ingester's self-scheduling chain: if nothing is
      # running or queued, start it (it ends itself when no session is due).
      - name: Start cloud ingester if idle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list -R "${{ github.repository }}" -w cloud-ingest.yml -L 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" = "0" ]; then
            gh workflow run cloud-ingest.yml -R "${{ github.repository }}" --ref master
            echo "Started cloud ingester."
          else
            echo "Cloud ingester already running or queued ($busy)."
          fi
