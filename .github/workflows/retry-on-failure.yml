name: Retry failed scheduled runs

on:
  workflow_run:
    workflows:
      - Update Schedule
      - Auto-Process New Sessions
    types:
      - completed

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Retrying ${{ github.event.workflow_run.name }} run $RUN_ID (attempt ${{ github.event.workflow_run.run_attempt }})"
          gh run rerun "$RUN_ID" --failed --repo "${{ github.repository }}"
