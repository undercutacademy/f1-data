name: Backfill Year Data

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to backfill (e.g. 2024)'
        required: true
        default: '2024'
      sessions:
        description: 'Session types to process (comma-separated, blank = all). E.g. Q,R'
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Backfill year
        run: |
          ARGS="${{ github.event.inputs.year }}"
          if [ -n "${{ github.event.inputs.sessions }}" ]; then
            ARGS="$ARGS --sessions ${{ github.event.inputs.sessions }}"
          fi
          python scripts/backfill_year.py $ARGS

      - name: Refresh sessions.json available flags
        if: always()
        run: python scripts/update_schedule.py "${{ github.event.inputs.year }}"

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "backfill: ${{ github.event.inputs.year }} data"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && {
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.pushed == 'true'
        run: bash scripts/purge_jsdelivr.sh
